services:
  postgres:
    image: postgres:16.3-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=moonuser
      - POSTGRES_DB=moonphases_db
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonuser -d moonphases_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: moonphases-backend:1.0.0
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=moonuser
      - DB_NAME=moonphases_db
      - DB_PASSWORD_FILE=/run/secrets/pg_password
    secrets:
      - pg_password
    networks:
      - public
      - private
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: moonphases-frontend:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - public
    depends_on:
      - backend

secrets:
  pg_password:
    file: ./pg_password.txt

volumes:
  postgres-data:

networks:
  public:
  private:
    internal: true
